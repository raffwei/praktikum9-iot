<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT Dashboard v2</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; color: #333; }
  .container { max-width: 1000px; margin: 0 auto; }
  h1 { color: white; text-align: center; margin-bottom: 25px; font-size: 28px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; }
  .card, .panel { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
  .card { text-align: center; }
  .panel { margin-bottom: 25px; }
  .panel h2 { font-size: 18px; margin-bottom: 15px; color: #444; }
  .card .label { font-size: 14px; color: #888; }
  .card .value { font-size: 42px; font-weight: bold; margin: 10px 0; color: #667eea; }
  .card .unit { font-size: 18px; color: #aaa; }
  .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin: 2px; }
  .on { background: #d4edda; color: #155724; }
  .off { background: #f8d7da; color: #721c24; }
  #alert-banner { background: #dc3545; color: white; padding: 14px 20px; border-radius: 12px; margin-bottom: 25px; font-weight: 600; }
  #alert-banner[hidden] { display: none; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .btn { padding: 12px 24px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; color: white; }
  .btn-on { background: #28a745; } .btn-off { background: #dc3545; } .btn-set { background: #667eea; }
  input[type=number] { padding: 11px; border: 1px solid #ccc; border-radius: 10px; width: 110px; font-size: 15px; }
  .chart-box { position: relative; height: 300px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
  th { background: #f8f9fa; color: #666; font-size: 13px; }
  #log { background: #1e1e1e; color: #0f0; font-family: monospace; padding: 15px; border-radius: 10px; max-height: 180px; overflow-y: auto; font-size: 13px; line-height: 1.6; }
  #log .error { color: #f66; } #log .info { color: #6af; }
</style>
</head>
<body>
<div class="container">
  <h1>🌡️ IoT Dashboard v2</h1>

  <div id="alert-banner" hidden></div>

  <div class="cards">
    <div class="card"><div class="label">Suhu</div><div class="value" id="suhu">--</div><div class="unit">°C</div></div>
    <div class="card"><div class="label">Kelembaban</div><div class="value" id="kelembaban">--</div><div class="unit">%</div></div>
    <div class="card">
      <div class="label">Status</div>
      <div style="margin-top:14px">
        <span class="badge off" id="badge-sensor">SENSOR OFFLINE</span><br>
        <span class="badge off" id="badge-ws">WEBSOCKET PUTUS</span>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>Kontrol Perangkat</h2>
    <div class="row">
      <button class="btn btn-on" onclick="kontrol('lamp','on')">💡 Nyalakan Lampu</button>
      <button class="btn btn-off" onclick="kontrol('lamp','off')">🌑 Matikan Lampu</button>
    </div>
  </div>

  <div class="panel">
    <h2>Batas Suhu (notifikasi)</h2>
    <div class="row">
      <input type="number" id="batas" step="0.1" value="30">
      <button class="btn btn-set" onclick="setThreshold()">Simpan batas</button>
      <span id="batas-aktif" style="color:#666">Batas aktif: --</span>
    </div>
  </div>

  <div class="panel">
    <h2>Grafik Real-time</h2>
    <div class="chart-box"><canvas id="grafik"></canvas></div>
  </div>

  <div class="panel">
    <h2>10 Data Sensor Terakhir</h2>
    <table>
      <thead><tr><th>Waktu</th><th>Suhu (°C)</th><th>Kelembaban (%)</th></tr></thead>
      <tbody id="history-body"><tr><td colspan="3" style="text-align:center;color:#999;">Memuat...</td></tr></tbody>
    </table>
  </div>

  <div class="panel">
    <h2>Log Aktivitas</h2>
    <div id="log"></div>
  </div>
</div>

<script>
// ===== KONFIGURASI =====
const BASE = location.protocol.startsWith('http') ? location.origin : 'http://localhost:1880';
const API = BASE + '/api';
const WS_URL = BASE.replace('http', 'ws') + '/ws/iot';
const API_KEY = 'kampus-rafi-7Xk29';   // harus sama dengan di node "Cek X-API-Key"
const MAX_POINTS = 30;

let hist = [];
let threshold = 30;
let lastSeen = 0;
let chart = null;

const $ = id => document.getElementById(id);

function log(msg, type = 'info') {
  const el = $('log');
  el.innerHTML += `<div class="${type}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'X-API-Key': API_KEY, ...(opts.headers || {}) }
  });
  return res.json();
}

function setBadge(id, ok, textOk, textBad) {
  const b = $(id);
  b.textContent = ok ? textOk : textBad;
  b.className = 'badge ' + (ok ? 'on' : 'off');
}

// ===== GRAFIK =====
function initChart() {
  if (!window.Chart) { log('Chart.js gagal dimuat, cek koneksi internet', 'error'); return; }
  chart = new Chart($('grafik'), {
    type: 'line',
    data: { labels: [], datasets: [
      { label: 'Suhu (°C)', data: [], borderColor: '#e4572e', backgroundColor: 'rgba(228,87,46,.15)', tension: .3, fill: true },
      { label: 'Kelembaban (%)', data: [], borderColor: '#2e86e4', tension: .3, yAxisID: 'y2' },
      { label: 'Batas suhu', data: [], borderColor: '#333', borderDash: [6, 4], pointRadius: 0 }
    ]},
    options: {
      animation: false, responsive: true, maintainAspectRatio: false,
      scales: {
        y: { title: { display: true, text: '°C' } },
        y2: { position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: '%' } }
      }
    }
  });
}

function renderChart() {
  if (!chart) return;
  chart.data.labels = hist.map(d => new Date(d.received).toLocaleTimeString());
  chart.data.datasets[0].data = hist.map(d => d.suhu);
  chart.data.datasets[1].data = hist.map(d => d.kelembaban);
  chart.data.datasets[2].data = hist.map(() => threshold);
  chart.update();
}

// ===== TAMPILAN =====
function renderTable() {
  const tbody = $('history-body');
  if (hist.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#999;">Belum ada data</td></tr>';
    return;
  }
  tbody.innerHTML = hist.slice(-10).reverse().map(d => `
    <tr><td>${new Date(d.received).toLocaleTimeString()}</td><td>${d.suhu}</td><td>${d.kelembaban}</td></tr>`).join('');
}

function setThresholdLabel() {
  $('batas-aktif').textContent = 'Batas aktif: ' + threshold + ' °C';
}

function onSensor(d, th) {
  threshold = th;
  hist.push(d);
  if (hist.length > MAX_POINTS) hist.shift();
  lastSeen = Date.now();
  $('suhu').textContent = d.suhu;
  $('kelembaban').textContent = d.kelembaban;
  setBadge('badge-sensor', true, 'SENSOR ONLINE', 'SENSOR OFFLINE');
  if (d.suhu <= th) $('alert-banner').hidden = true;
  setThresholdLabel();
  renderTable();
  renderChart();
}

function showAlert(a) {
  const b = $('alert-banner');
  b.textContent = '⚠️ ' + a.message;
  b.hidden = false;
  log('NOTIFIKASI: ' + a.message, 'error');
  if (window.Notification && Notification.permission === 'granted') {
    new Notification('Peringatan suhu', { body: a.message });
  }
}

// ===== WEBSOCKET =====
function connectWS() {
  const ws = new WebSocket(WS_URL);
  ws.onopen = () => { setBadge('badge-ws', true, 'WEBSOCKET AKTIF', 'WEBSOCKET PUTUS'); log('WebSocket terhubung, tanpa polling'); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'sensor') onSensor(m.data, m.threshold);
    else if (m.type === 'alert') showAlert(m);
  };
  ws.onclose = () => {
    setBadge('badge-ws', false, 'WEBSOCKET AKTIF', 'WEBSOCKET PUTUS');
    log('WebSocket putus, mencoba lagi dalam 3 detik', 'error');
    setTimeout(connectWS, 3000);
  };
  ws.onerror = () => ws.close();
}

// ===== AKSI =====
async function kontrol(device, action) {
  try {
    const j = await api('/kontrol', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ device, action })
    });
    if (j.status === 'success') log(`✓ Perintah terkirim: ${device} → ${action}`);
    else log(`✗ Gagal: ${j.message}`, 'error');
  } catch (err) { log('✗ Error kontrol: ' + err.message, 'error'); }
}

async function setThreshold() {
  const v = parseFloat($('batas').value);
  if (isNaN(v)) { log('Isi angka batas suhu dulu', 'error'); return; }
  if (window.Notification && Notification.permission === 'default') Notification.requestPermission();
  try {
    const j = await api('/threshold', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ batas: v })
    });
    if (j.status === 'success') { threshold = j.batas; setThresholdLabel(); renderChart(); log('✓ Batas suhu diubah menjadi ' + j.batas + ' °C'); }
    else log('✗ Gagal: ' + j.message, 'error');
  } catch (err) { log('✗ Error threshold: ' + err.message, 'error'); }
}

// ===== MULAI =====
async function init() {
  initChart();
  try {
    const h = await api('/history');
    if (h.status === 'success') { hist = h.data.slice(-MAX_POINTS); log('History dimuat dari ' + h.source + ' (' + h.count + ' data)'); }
    else log('History: ' + h.message, 'error');
    const s = await api('/suhu');
    if (s.status === 'success') {
      threshold = s.threshold;
      $('batas').value = threshold;
      if (s.data.suhu !== null) { $('suhu').textContent = s.data.suhu; $('kelembaban').textContent = s.data.kelembaban; }
    }
  } catch (err) { log('Gagal memuat data awal: ' + err.message, 'error'); }
  setThresholdLabel(); renderTable(); renderChart();
  connectWS();
}

setInterval(() => {
  if (lastSeen && Date.now() - lastSeen > 10000) setBadge('badge-sensor', false, 'SENSOR ONLINE', 'SENSOR OFFLINE');
}, 2000);

init();
</script>
</body>
</html>
